name: Build on Multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build schilytools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev libcap-dev

      - name: Build all Zig targets
        run: zig build

      - name: Smoke test mkisofs
        run: zig-out/bin/mkisofs --version
